[project]
name = "studio-ghibli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ofoscar", email = "ktaoscar@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.150.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings[dotenv]>=2.16.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
]

[project.scripts]
studio-ghibli = "studio_ghibli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
